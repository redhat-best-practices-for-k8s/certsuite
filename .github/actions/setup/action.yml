---
name: initial-setup-resources
description: A shared action that removes a lot of copied
              tasks from steps in our CI

runs:
  using: 'composite'
  steps:
    - name: Write temporary docker file
      run: |
        mkdir -p $GITHUB_WORKSPACE/.docker
        touch ${PFLT_DOCKERCONFIG}
        echo '{ "auths": {} }' >> ${PFLT_DOCKERCONFIG}
      shell: bash

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Disable default go problem matcher
      run: echo "::remove-matcher owner=go::"
      shell: bash
