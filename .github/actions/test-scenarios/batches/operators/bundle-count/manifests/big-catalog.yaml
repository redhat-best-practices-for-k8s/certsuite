apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-smoke-big-opm
  namespace: operators-big-catalog-smoke-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scenario-smoke-big-opm
  template:
    metadata:
      labels:
        app: scenario-smoke-big-opm
        olm.catalogSource: scenario-smoke-big-cs
    spec:
      containers:
        - name: opm
          image: "quay.io/operator-framework/opm:v1.74.0"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/opm
          args:
            - serve
            - /fbc
          ports:
            - containerPort: 50051
          volumeMounts:
            - name: fbc
              mountPath: /fbc/catalog.yaml
              subPath: catalog.yaml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: fbc
          configMap:
            name: scenario-smoke-big-fbc
---
apiVersion: v1
kind: Service
metadata:
  name: scenario-smoke-big-opm
  namespace: operators-big-catalog-smoke-ns
spec:
  selector:
    olm.catalogSource: scenario-smoke-big-cs
  ports:
    - port: 50051
      targetPort: 50051
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: scenario-smoke-big-cs
  namespace: operators-big-smoke-ns
spec:
  sourceType: grpc
  address: ""
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: scenario-smoke-big-og
  namespace: operators-big-smoke-ns
spec:
  targetNamespaces:
    - operators-big-smoke-ns
