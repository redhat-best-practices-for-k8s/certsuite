---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-only
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-only
      scenario-policy: target
  template:
    metadata:
      labels:
        app: ingress-only
        scenario-policy: target
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-only
spec:
  podSelector:
    matchLabels:
      scenario-policy: target
  policyTypes:
    - Ingress
