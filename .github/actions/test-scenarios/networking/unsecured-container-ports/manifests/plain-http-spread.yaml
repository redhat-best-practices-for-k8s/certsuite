---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain-http-spread
spec:
  replicas: 2
  selector:
    matchLabels:
      app: plain-http-spread
      unsecured-ports: target
  template:
    metadata:
      labels:
        app: plain-http-spread
        unsecured-ports: target
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: plain-http-spread
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: plain-http-spread-svc
spec:
  selector:
    app: plain-http-spread
  ports:
    - port: 80
      targetPort: 8080
