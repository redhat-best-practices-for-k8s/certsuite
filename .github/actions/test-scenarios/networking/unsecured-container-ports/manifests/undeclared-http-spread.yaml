---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: undeclared-http-spread
spec:
  replicas: 2
  selector:
    matchLabels:
      app: undeclared-http-spread
      unsecured-ports: target
  template:
    metadata:
      labels:
        app: undeclared-http-spread
        unsecured-ports: target
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: undeclared-http-spread
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
