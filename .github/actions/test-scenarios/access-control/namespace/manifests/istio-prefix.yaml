---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scenario-account
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-prefix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: istio-prefix
      scenario-namespace: target
  template:
    metadata:
      labels:
        app: istio-prefix
        scenario-namespace: target
    spec:
      serviceAccountName: scenario-account
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27
