---
# port-name-sftp breaks only the port-name format (its image is tagged);
# image-untagged breaks only the image tag check (it declares no ports).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-name-sftp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: port-name-sftp
      scenario-container: target
  template:
    metadata:
      labels:
        app: port-name-sftp
        scenario-container: target
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27
          ports:
            - name: sftp
              containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-untagged
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-untagged
      scenario-container: target
  template:
    metadata:
      labels:
        app: image-untagged
        scenario-container: target
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged
