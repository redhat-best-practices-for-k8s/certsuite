name: QE OCP 5.0 Intrusive Testing

on:
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:
  # Schedule a daily cron at midnight UTC
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  qe-ocp-50-intrusive:
    uses: ./.github/workflows/_qe-ocp-crc.yaml
    with:
      ocp-version: '5.0'
      ocp-version-slug: '50'
      intrusive: true
      suites: '["lifecycle"]'
      job-timeout: 300
      test-timeout: 180
    secrets:
      CRC_PULL_SECRET: ${{ secrets.CRC_PULL_SECRET }}
      QE_NIGHTLY_WEBHOOK: ${{ secrets.QE_NIGHTLY_WEBHOOK }}
