name: QE OCP 4.21 Testing

on:
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:
  # Schedule a daily cron at midnight UTC
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  qe-ocp-421:
    uses: ./.github/workflows/_qe-ocp-crc.yaml
    with:
      ocp-version: '4.21'
      ocp-version-slug: '421'
      intrusive: false
      suites: '["affiliatedcertification-ocp", "performance-ocp", "platformalteration1-ocp", "platformalteration2-ocp", "platformalteration3-ocp", "platformalteration4-ocp"]'
    secrets:
      CRC_PULL_SECRET: ${{ secrets.CRC_PULL_SECRET }}
      QE_NIGHTLY_WEBHOOK: ${{ secrets.QE_NIGHTLY_WEBHOOK }}
