name: _QE OCP Self-Hosted Reusable

on:
  workflow_call:
    inputs:
      ocp-version:
        description: 'OCP version (e.g., 4.16)'
        required: true
        type: string
      ocp-version-slug:
        description: 'OCP version slug for naming (e.g., 416)'
        required: true
        type: string
      runner-label:
        description: 'Self-hosted runner label (e.g., qe-ocp-416)'
        required: true
        type: string
      lab-user:
        description: 'Lab user on the self-hosted runner (e.g., labuser3)'
        required: true
        type: string
      intrusive:
        description: 'Run intrusive tests (true) or non-intrusive (false)'
        required: true
        type: boolean
      suites:
        description: 'JSON array of test suites to run'
        required: true
        type: string
      job-timeout:
        description: 'Job-level timeout in minutes'
        required: false
        type: number
        default: 240
      test-timeout:
        description: 'Per-test retry timeout in minutes'
        required: false
        type: number
        default: 120
    secrets:
      QE_NIGHTLY_WEBHOOK:
        required: true

permissions:
  contents: read

env:
  QE_REPO: redhat-best-practices-for-k8s/certsuite-qe
  ENABLE_CERTSUITE_MEMORY_LIMIT: true

jobs:
  build-and-store:
    if: github.repository_owner == 'redhat-best-practices-for-k8s'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Free Disk Space
        uses: ./.github/actions/free-disk-space
        continue-on-error: true

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build temporary image tag for this PR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          tags: quay.io/redhat-best-practices-for-k8s/certsuite:localtest-${{ inputs.ocp-version-slug }}
          outputs: type=docker,dest=${{ runner.temp }}/testimage-${{ inputs.ocp-version-slug }}.tar

      - name: Build the binary
        run: make build-certsuite-tool

      - name: Store image as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testimage
          path: ${{ runner.temp }}/testimage-${{ inputs.ocp-version-slug }}.tar

      - name: Store binary as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certsuite-binary
          path: ./certsuite

  qe-testing:
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.job-timeout }}
    needs: build-and-store
    if: needs.build-and-store.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(inputs.suites) }}
    env:
      SHELL: /bin/bash
      KUBECONFIG: '/home/${{ inputs.lab-user }}/.kube/config'
      PFLT_DOCKERCONFIG: '/home/${{ inputs.lab-user }}/.docker/config'
      CERTSUITE_IMAGE_NAME: quay.io/redhat-best-practices-for-k8s/certsuite
      TEST_CERTSUITE_IMAGE_TAG: localtest-${{ inputs.ocp-version-slug }}
      DOCKER_CONFIG_DIR: '/home/${{ inputs.lab-user }}/.docker'
      CERTSUITE_CONFIG_DIR: '/home/${{ inputs.lab-user }}/certsuite_config'
      CERTSUITE_REPORT_DIR: '/home/${{ inputs.lab-user }}/tnf_report'

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run initial setup
        uses: ./.github/actions/setup

      - name: Show pods
        run: oc get pods -A

      - name: Clone the QE repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.QE_REPO }}
          path: certsuite-qe

      - name: Preemptively potential QE namespaces
        run: ./scripts/delete-namespaces.sh
        working-directory: certsuite-qe

      - name: Preemptively delete contents of openshift-marketplace namespace
        run: ./scripts/clean-marketplace.sh
        working-directory: certsuite-qe

      - name: Preemptively delete report and config folders
        shell: bash
        run: |
          sudo rm -rf ${{env.CERTSUITE_CONFIG_DIR}}
          sudo rm -rf ${{env.CERTSUITE_REPORT_DIR}}

      - name: Download image from artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testimage
          path: ${{ runner.temp }}

      - name: Load image into docker
        run: docker load --input ${{ runner.temp }}/testimage-${{ inputs.ocp-version-slug }}.tar

      - name: Run the tests (against image)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: ${{ inputs.test-timeout }}
          max_attempts: 2
          command: cd ${GITHUB_WORKSPACE}/certsuite-qe; FEATURES=${{matrix.suite}} CERTSUITE_REPO_PATH=${GITHUB_WORKSPACE} CERTSUITE_IMAGE=${{env.CERTSUITE_IMAGE_NAME}} CERTSUITE_IMAGE_TAG=${{env.TEST_CERTSUITE_IMAGE_TAG}} JOB_ID=${{github.run_id}} DISABLE_INTRUSIVE_TESTS=${{ inputs.intrusive == false }} ENABLE_PARALLEL=true ENABLE_FLAKY_RETRY=true make test-features

      - name: Download binary from artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: certsuite-binary
          path: .

      - name: Make binary executable
        run: chmod +x ./certsuite

      - name: Run the tests (against binary)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: ${{ inputs.test-timeout }}
          max_attempts: 2
          command: cd ${GITHUB_WORKSPACE}/certsuite-qe; FEATURES=${{matrix.suite}} CERTSUITE_REPO_PATH=${GITHUB_WORKSPACE} USE_BINARY=true JOB_ID=${{github.run_id}} DISABLE_INTRUSIVE_TESTS=${{ inputs.intrusive == false }} ENABLE_PARALLEL=true ENABLE_FLAKY_RETRY=true make test-features

      - name: Cleanup self-hosted runner images
        run: docker image prune -f

      - name: (if on main and upstream) Send chat msg to dev team if failed to run QE tests
        if: ${{ failure() && github.ref == 'refs/heads/main' && github.repository_owner == 'redhat-best-practices-for-k8s' }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          JOB_RUN_ID: ${{ github.run_id }}
          JOB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPO: https://github.com/redhat-best-practices-for-k8s/certsuite
        run: |
          curl -X POST --data "{
              \"text\": \"🚨⚠️  Failed to run ${{ inputs.intrusive && 'intrusive' || 'non-intrusive' }} OCP ${{ inputs.ocp-version }} QE tests from commit \<$GITHUB_REPO/commit/$COMMIT_SHA|$COMMIT_SHA\>, job ID \<$GITHUB_REPO/actions/runs/$JOB_RUN_ID/attempts/$JOB_RUN_ATTEMPT|$JOB_RUN_ID\> \"
          }" -H 'Content-type: application/json; charset=UTF-8' '${{ secrets.QE_NIGHTLY_WEBHOOK }}'
